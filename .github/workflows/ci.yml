name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend syntax and import check
        working-directory: backend
        env:
          AUTH_DISABLED: "1"
          LLM_PROVIDER: mock
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m compileall -q .
          python -c "import fast_api_app; print('import ok')"
