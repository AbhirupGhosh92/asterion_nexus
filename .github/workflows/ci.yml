name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs over the whole tree, not just the diff: the pre-commit hook can
      # be skipped with --no-verify, so this is the check that actually holds.
      - name: Secret scan
        run: python3 scripts/scan_secrets.py --all

      - name: Frontend typecheck and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend syntax and import check
        working-directory: backend
        env:
          AUTH_DISABLED: "1"
          LLM_PROVIDER: mock
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m compileall -q .
          python -c "import app; print('import ok')"
